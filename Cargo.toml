[package]
name = "nmr-viewer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nmr-viewer"
path = "rust/main.rs"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = {version="1",features=["float_roundtrip"]}

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
