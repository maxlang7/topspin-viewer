[package]
name = "nmr-viewer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nmr-viewer"
path = "rust/main.rs"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = {version="1",features=["float_roundtrip"]}
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[features]
default = ["native-raw", "native-project"]
native-project = []
native-raw = []
parity-tools = ["native-raw"]

[build-dependencies]
cc = "1"

[[bin]]
name = "raw-parity-check"
path = "tests/parity-audit/raw_check.rs"
required-features = ["parity-tools"]
